services:
  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:v1.38.2@sha256:7a480a1604fa3b42efeddc7db9527690d9f9bc903226136013e2bfe6b1a4dfb0
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      DOCLING_SERVE_API_KEY: ${DOCLING_SERVE_API_KEY:?Set the parser API key}
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_ALLOWED_SOURCE_TYPES: file
      DOCLING_SERVE_ALLOWED_TARGET_TYPES: inbody
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "false"
      DOCLING_SERVE_MAX_NUM_PAGES: "200"
      DOCLING_SERVE_MAX_FILE_SIZE: "20971520"
      DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT: "900"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
      DOCLING_SERVE_OPTIONS_CACHE_SIZE: "1"
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "false"
      DOCLING_DEVICE: cpu
      DOCLING_NUM_THREADS: "2"
      HF_HUB_DISABLE_TELEMETRY: "1"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 2
    mem_limit: 6g
